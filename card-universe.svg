<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="The FAR Fortune card universe on Base">
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="110%">
      <stop offset="0" stop-color="#1d1a12"/>
      <stop offset="0.6" stop-color="#0c0b09"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1c2"/><stop offset="0.45" stop-color="#e8c06a"/><stop offset="1" stop-color="#a8761f"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6fbff"/><stop offset="0.5" stop-color="#7fd6e6"/><stop offset="1" stop-color="#2b7c8c"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- a small card: rarity colour comes from the stroke -->
    <g id="card">
      <rect x="-22" y="-31" width="44" height="62" rx="5" fill="#0d0c0a"/>
      <circle cx="0" cy="-4" r="9" fill="none" stroke-width="1.6"/>
      <circle cx="0" cy="-4" r="3" stroke="none"/>
      <path d="M-12 18 H12" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .bob { animation: bob 4s ease-in-out infinite; }
    .bob.b { animation-delay: .5s; } .bob.c { animation-delay: 1s; } .bob.d { animation-delay: 1.5s; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    /* forge: two Commons slide together, a Rare appears */
    .fl { animation: fl 6s ease-in-out infinite; } .fr { animation: fr 6s ease-in-out infinite; }
    @keyframes fl { 0%, 15% { transform: translateX(0); opacity: 1; } 45% { transform: translateX(26px); opacity: 1; } 55%, 85% { transform: translateX(26px); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
    @keyframes fr { 0%, 15% { transform: translateX(0); opacity: 1; } 45% { transform: translateX(-26px); opacity: 1; } 55%, 85% { transform: translateX(-26px); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
    .fo { opacity: 0; animation: fo 6s ease-in-out infinite; }
    @keyframes fo { 0%, 45% { opacity: 0; } 55%, 85% { opacity: 1; } 100% { opacity: 0; } }
    .spark { opacity: 0; animation: spark 6s ease-out infinite; }
    @keyframes spark { 0%, 44% { opacity: 0; } 50% { opacity: 1; } 62%, 100% { opacity: 0; } }
    /* bloodlines: a sealed child appears, then is revealed */
    .seal { opacity: 0; animation: seal 7s ease-in-out infinite; }
    @keyframes seal { 0%, 20% { opacity: 0; } 30%, 55% { opacity: 1; } 65%, 100% { opacity: 0; } }
    .child { opacity: 0; animation: child 7s ease-in-out infinite; }
    @keyframes child { 0%, 58% { opacity: 0; } 68%, 92% { opacity: 1; } 100% { opacity: 0; } }
    .link { stroke-dasharray: 4 4; animation: flow 1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -8; } }
    /* seasons: 100 lines fill up, then Cyan Steel */
    .ln { opacity: .18; animation: fill 10s steps(1) infinite; }
    @keyframes fill { 0% { opacity: .18; } 8%, 90% { opacity: 1; } 100% { opacity: .18; } }
    .steel { opacity: 0; animation: steel 10s ease-in-out infinite; }
    @keyframes steel { 0%, 78% { opacity: 0; } 84%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .fo, .child, .ln, .steel { opacity: 1; } .seal { opacity: 0; } }
  </style>

  <rect width="960" height="330" rx="18" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="958.5" height="328.5" rx="17.5" fill="none" stroke="#a8761f" stroke-opacity="0.55"/>
  <text x="40" y="46" font-size="13" letter-spacing="4" fill="#d9a441">FAR FORTUNE · ON BASE</text>
  <text x="40" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="url(#gold)">The card universe</text>

  <!-- panels -->
  <g fill="none" stroke="#a8761f" stroke-opacity="0.35">
    <rect x="30" y="100" width="210" height="170" rx="12"/>
    <rect x="260" y="100" width="210" height="170" rx="12"/>
    <rect x="490" y="100" width="210" height="170" rx="12"/>
    <rect x="720" y="100" width="210" height="170" rx="12"/>
  </g>

  <!-- 1 collect: four rarities float -->
  <g transform="translate(135 175)">
    <g class="bob a"><use href="#card" x="-69" stroke="#c9c2b0" fill="#c9c2b0"/></g>
    <g class="bob b"><use href="#card" x="-23" stroke="#a78bfa" fill="#a78bfa"/></g>
    <g class="bob c"><use href="#card" x="23" stroke="#5fc48a" fill="#5fc48a"/></g>
    <g class="bob d"><use href="#card" x="69" stroke="#e8c06a" fill="#e8c06a" filter="url(#glow)"/></g>
  </g>
  <text x="135" y="238" text-anchor="middle" font-size="15" font-weight="700" fill="#ede1c5">Collect</text>
  <text x="135" y="256" text-anchor="middle" font-size="11.5" fill="#9a8c6c">Common to Legendary</text>

  <!-- 2 forge -->
  <g transform="translate(365 172)">
    <g class="fl"><use href="#card" x="-28" stroke="#c9c2b0" fill="#c9c2b0"/></g>
    <g class="fr"><use href="#card" x="28" stroke="#c9c2b0" fill="#c9c2b0"/></g>
    <g class="fo"><use href="#card" x="0" stroke="#a78bfa" fill="#a78bfa" filter="url(#glow)"/></g>
    <g class="spark" stroke="#ffe7a8" stroke-width="2" stroke-linecap="round">
      <path d="M0 -46 v-10 M-22 -38 l-7 -7 M22 -38 l7 -7 M-30 -16 h-10 M30 -16 h10"/>
    </g>
  </g>
  <text x="365" y="238" text-anchor="middle" font-size="15" font-weight="700" fill="#ede1c5">Forge</text>
  <text x="365" y="256" text-anchor="middle" font-size="11.5" fill="#9a8c6c">Two cards into one of the next rarity</text>

  <!-- 3 bloodlines -->
  <g transform="translate(595 138)">
    <use href="#card" x="-36" y="-2" stroke="#a78bfa" fill="#a78bfa" transform="scale(0.75)"/>
    <use href="#card" x="36" y="-2" stroke="#5fc48a" fill="#5fc48a" transform="scale(0.75)"/>
    <path class="link" d="M-27 24 L0 35 M27 24 L0 35" stroke="#c9983f" stroke-width="1.6" fill="none"/>
    <g transform="translate(0 58) scale(0.75)">
      <g class="seal">
        <rect x="-22" y="-31" width="44" height="62" rx="5" fill="#14110a" stroke="#d4a24a"/>
        <circle cx="0" cy="0" r="11" fill="#8f1d1d" stroke="#d4a24a"/>
      </g>
      <g class="child"><use href="#card" stroke="#a78bfa" fill="#a78bfa" filter="url(#glow)"/></g>
    </g>
  </g>
  <text x="595" y="238" text-anchor="middle" font-size="15" font-weight="700" fill="#ede1c5">Bloodlines</text>
  <text x="595" y="256" text-anchor="middle" font-size="11.5" fill="#9a8c6c">A sealed child, revealed by its owner</text>

  <!-- 4 seasons: 10 x 10 lines, then Cyan Steel -->
  <g transform="translate(775 116)">
    <g fill="#e8c06a">
      <rect class="ln" style="animation-delay:0s" x="0" y="0" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:.08s" x="10" y="0" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:.16s" x="20" y="0" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:.24s" x="30" y="0" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:.32s" x="40" y="0" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:.4s" x="50" y="0" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:.48s" x="60" y="0" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:.56s" x="70" y="0" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:.64s" x="80" y="0" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:.72s" x="90" y="0" width="7" height="7" rx="1.5"/>
      <rect class="ln" style="animation-delay:.8s" x="0" y="10" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:.88s" x="10" y="10" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:.96s" x="20" y="10" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:1.04s" x="30" y="10" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:1.12s" x="40" y="10" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:1.2s" x="50" y="10" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:1.28s" x="60" y="10" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:1.36s" x="70" y="10" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:1.44s" x="80" y="10" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:1.52s" x="90" y="10" width="7" height="7" rx="1.5"/>
      <rect class="ln" style="animation-delay:1.6s" x="0" y="20" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:1.68s" x="10" y="20" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:1.76s" x="20" y="20" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:1.84s" x="30" y="20" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:1.92s" x="40" y="20" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:2s" x="50" y="20" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:2.08s" x="60" y="20" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:2.16s" x="70" y="20" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:2.24s" x="80" y="20" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:2.32s" x="90" y="20" width="7" height="7" rx="1.5"/>
      <rect class="ln" style="animation-delay:2.4s" x="0" y="30" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:2.48s" x="10" y="30" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:2.56s" x="20" y="30" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:2.64s" x="30" y="30" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:2.72s" x="40" y="30" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:2.8s" x="50" y="30" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:2.88s" x="60" y="30" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:2.96s" x="70" y="30" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:3.04s" x="80" y="30" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:3.12s" x="90" y="30" width="7" height="7" rx="1.5"/>
      <rect class="ln" style="animation-delay:3.2s" x="0" y="40" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:3.28s" x="10" y="40" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:3.36s" x="20" y="40" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:3.44s" x="30" y="40" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:3.52s" x="40" y="40" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:3.6s" x="50" y="40" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:3.68s" x="60" y="40" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:3.76s" x="70" y="40" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:3.84s" x="80" y="40" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:3.92s" x="90" y="40" width="7" height="7" rx="1.5"/>
      <rect class="ln" style="animation-delay:4s" x="0" y="50" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:4.08s" x="10" y="50" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:4.16s" x="20" y="50" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:4.24s" x="30" y="50" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:4.32s" x="40" y="50" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:4.4s" x="50" y="50" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:4.48s" x="60" y="50" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:4.56s" x="70" y="50" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:4.64s" x="80" y="50" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:4.72s" x="90" y="50" width="7" height="7" rx="1.5"/>
      <rect class="ln" style="animation-delay:4.8s" x="0" y="60" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:4.88s" x="10" y="60" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:4.96s" x="20" y="60" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:5.04s" x="30" y="60" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:5.12s" x="40" y="60" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:5.2s" x="50" y="60" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:5.28s" x="60" y="60" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:5.36s" x="70" y="60" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:5.44s" x="80" y="60" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:5.52s" x="90" y="60" width="7" height="7" rx="1.5"/>
      <rect class="ln" style="animation-delay:5.6s" x="0" y="70" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:5.68s" x="10" y="70" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:5.76s" x="20" y="70" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:5.84s" x="30" y="70" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:5.92s" x="40" y="70" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:6s" x="50" y="70" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:6.08s" x="60" y="70" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:6.16s" x="70" y="70" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:6.24s" x="80" y="70" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:6.32s" x="90" y="70" width="7" height="7" rx="1.5"/>
      <rect class="ln" style="animation-delay:6.4s" x="0" y="80" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:6.48s" x="10" y="80" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:6.56s" x="20" y="80" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:6.64s" x="30" y="80" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:6.72s" x="40" y="80" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:6.8s" x="50" y="80" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:6.88s" x="60" y="80" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:6.96s" x="70" y="80" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:7.04s" x="80" y="80" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:7.12s" x="90" y="80" width="7" height="7" rx="1.5"/>
      <rect class="ln" style="animation-delay:7.2s" x="0" y="90" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:7.28s" x="10" y="90" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:7.36s" x="20" y="90" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:7.44s" x="30" y="90" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:7.52s" x="40" y="90" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:7.6s" x="50" y="90" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:7.68s" x="60" y="90" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:7.76s" x="70" y="90" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:7.84s" x="80" y="90" width="7" height="7" rx="1.5"/><rect class="ln" style="animation-delay:7.92s" x="90" y="90" width="7" height="7" rx="1.5"/>
    </g>
    <g class="steel" transform="translate(48 48)" filter="url(#glow)">
      <rect x="-30" y="-20" width="60" height="40" rx="6" fill="url(#cyan)" stroke="#e6fbff"/>
      <text x="0" y="5" text-anchor="middle" font-size="10" font-weight="700" fill="#0b2a30">CYAN STEEL</text>
    </g>
  </g>
  <text x="825" y="238" text-anchor="middle" font-size="15" font-weight="700" fill="#ede1c5">Seasons</text>
  <text x="825" y="256" text-anchor="middle" font-size="11.5" fill="#9a8c6c">100 lines, badges, Cyan Steel</text>

  <text x="480" y="304" text-anchor="middle" font-size="12" fill="#9a8c6c">Collectibles only. FAR promises no value, return or buy-back.</text>
</svg>
