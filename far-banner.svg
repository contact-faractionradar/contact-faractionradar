<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="FAR Action Radar">
  <defs>
    <radialGradient id="bg" cx="78%" cy="50%" r="80%">
      <stop offset="0" stop-color="#1d1a12"/>
      <stop offset="0.55" stop-color="#0c0b09"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1c2"/>
      <stop offset="0.45" stop-color="#e8c06a"/>
      <stop offset="1" stop-color="#a8761f"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8c06a" stop-opacity="0"/>
      <stop offset="1" stop-color="#e8c06a" stop-opacity="0.32"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1277" height="317" rx="17" fill="none" stroke="#a8761f" stroke-opacity="0.55" stroke-width="1.5"/>
  <!-- radar on the right -->
  <g transform="translate(1040 160)">
    <circle r="132" fill="none" stroke="#e8c06a" stroke-opacity="0.16"/>
    <circle r="98" fill="none" stroke="#e8c06a" stroke-opacity="0.2"/>
    <circle r="64" fill="none" stroke="#e8c06a" stroke-opacity="0.26"/>
    <circle r="30" fill="none" stroke="#e8c06a" stroke-opacity="0.34"/>
    <path d="M-132 0 H132 M0 -132 V132" stroke="#e8c06a" stroke-opacity="0.12"/>
    <path d="M0 0 L132 0 A132 132 0 0 0 93 -93 Z" fill="url(#sweep)"/>
    <circle cx="52" cy="-38" r="5" fill="#e8c06a"/>
    <circle cx="52" cy="-38" r="11" fill="none" stroke="#e8c06a" stroke-opacity="0.45"/>
    <circle cx="-70" cy="44" r="4" fill="#d9a441" fill-opacity="0.75"/>
    <circle cx="18" cy="96" r="3.5" fill="#d9a441" fill-opacity="0.6"/>
