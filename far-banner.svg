  <!-- wordmark -->
  <text x="72" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="5" fill="#d9a441">BASE · WEEKLY CALLS · ON THE RECORD</text>
  <text x="70" y="186" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700" fill="url(#gold)">FAR Action Radar</text>
  <text x="72" y="236" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#ede1c5">Gold, bitcoin and oil calls, written to Base when they are published.</text>
  <text x="72" y="270" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#9a8c6c">Research data, not investment advice.</text>
