<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" role="img" aria-label="How a weekly call is recorded on Base">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1c2"/>
      <stop offset="0.45" stop-color="#e8c06a"/>
      <stop offset="1" stop-color="#a8761f"/>
    </linearGradient>
  </defs>
  <rect width="960" height="250" rx="16" fill="#f7f1e3"/>
  <rect x="0.75" y="0.75" width="958.5" height="248.5" rx="15.5" fill="none" stroke="#d8c08a"/>
  <text x="480" y="38" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2b2210">How a weekly call ends up on Base</text>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- connectors -->
    <path d="M196 120 H260 M436 120 H500 M676 120 H740" stroke="#c9983f" stroke-width="2" stroke-dasharray="5 5"/>
    <path d="M254 114 L262 120 L254 126 M494 114 L502 120 L494 126 M734 114 L742 120 L734 126" fill="none" stroke="#c9983f" stroke-width="2"/>
    <!-- 1 engines -->
    <rect x="36" y="64" width="160" height="112" rx="14" fill="#fffdf8" stroke="#2b2210" stroke-width="1.6"/>
    <circle cx="80" cy="102" r="14" fill="#d9a441"/><text x="80" y="107" font-size="12" font-weight="700" fill="#1a1409">Au</text>
    <circle cx="116" cy="102" r="14" fill="#f7931a"/><text x="116" y="107" font-size="12" font-weight="700" fill="#fff">₿</text>
    <circle cx="152" cy="102" r="14" fill="#5b3a1e"/><text x="152" y="107" font-size="11" font-weight="700" fill="#f3e3c8">OIL</text>
    <text x="116" y="146" font-size="14" font-weight="700" fill="#2b2210">Three engines</text>
    <text x="116" y="164" font-size="11.5" fill="#6b5a3a">NORTH · AXIS · RIG</text>
    <!-- 2 call -->
    <rect x="276" y="64" width="160" height="112" rx="14" fill="#fffdf8" stroke="#2b2210" stroke-width="1.6"/>
    <rect x="316" y="86" width="80" height="30" rx="7" fill="url(#g)"/><text x="356" y="106" font-size="13" font-weight="700" fill="#1a1409">LONG</text>
    <text x="356" y="146" font-size="14" font-weight="700" fill="#2b2210">One call a week</text>
    <text x="356" y="164" font-size="11.5" fill="#6b5a3a">LONG, SHORT or FLAT</text>
    <!-- 3 recorded -->
    <rect x="516" y="64" width="160" height="112" rx="14" fill="#fffdf8" stroke="#2b2210" stroke-width="1.6"/>
    <circle cx="596" cy="101" r="17" fill="#0052ff"/><path d="M588 101 l6 6 l11 -12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="596" y="146" font-size="14" font-weight="700" fill="#2b2210">Written to Base</text>
    <text x="596" y="164" font-size="11.5" fill="#6b5a3a">when it is published</text>
    <!-- 4 result -->
    <rect x="756" y="64" width="160" height="112" rx="14" fill="#fffdf8" stroke="#2b2210" stroke-width="1.6"/>
    <rect x="806" y="84" width="60" height="38" rx="5" fill="#f2e6cc" stroke="#c9983f"/>
    <path d="M814 112 l10 -10 l9 6 l13 -14 l12 8" fill="none" stroke="#2b2210" stroke-width="2"/>
    <text x="836" y="146" font-size="14" font-weight="700" fill="#2b2210">Result added</text>
    <text x="836" y="164" font-size="11.5" fill="#6b5a3a">when the week closes</text>
  </g>
  <text x="480" y="216" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#6b5a3a">Wins and losses stay on the record. Anyone can check them at faractionradar.com/verify</text>
</svg>
